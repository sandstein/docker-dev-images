variables:
    DOCKER_DRIVER: overlay2
    BUILD_TARGET: ""
    BUILD_ALL: "false"

stages:
  - build

.build: &build
  stage: build
  script:
    - 'bin/build.sh $TARGET'
    - 'bin/push.sh $TARGET'
    - 'bin/cleanup.sh $TARGET'
  tags:
    - shell

.build-php: &build-php
  stage: build
  script:
    - 'bin/build.sh php $TYPE $VERSION'
    - 'bin/push.sh php'
    - 'bin/cleanup.sh php'
  tags:
    - shell

before_script:
  - docker-compose pull

# build apache
build-apache:
  rules:
    - if: $BUILD_TARGET == "apache" || $BUILD_ALL == "true"
      when: always
  variables:
    TARGET: apache
  <<: *build

# build elasticsearch
build-elasticsearch:
  rules:
    - if: $BUILD_TARGET == "elasticsearch" || $BUILD_ALL == "true"
      when: always
  variables:
    TARGET: elasticsearch
  <<: *build

